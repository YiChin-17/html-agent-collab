<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session UX Acceptance</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f0e8;
      color: #152238;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
    }
    main {
      width: min(760px, calc(100vw - 64px));
      padding: 56px;
      border: 2px solid #152238;
      border-radius: 28px;
      background: #fffdf6;
      box-shadow: 14px 14px 0 #d8b45b;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 0.95;
    }
    #paint-target {
      margin: 28px 0;
      padding: 28px;
      border-radius: 18px;
      background: #dce9ff;
      font-size: 20px;
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    button {
      padding: 14px 22px;
      border: 0;
      border-radius: 999px;
      background: #152238;
      color: white;
      font: inherit;
      font-weight: 700;
    }
    #manual-count {
      margin-top: 18px;
    }
    /* 長頁面：讓 #scroll-anchor 遠離第一個 viewport，驗證 mark 錨定在內容而非螢幕。 */
    .spacer {
      height: 1600px;
    }
    #scroll-anchor {
      width: min(760px, calc(100vw - 64px));
      padding: 40px;
      border-radius: 18px;
      background: #ffe0d0;
      font-size: 20px;
    }
  </style>
</head>
<body data-reload="initial">
  <main>
    <h1 id="hero-title">Awaiting session UX</h1>
    <p id="draft-target">source-backed Hello</p>
    <section id="paint-target">Paint across this panel and explain the requested change.</section>
    <div class="actions">
      <button id="cta" type="button">Pending paint</button>
      <button id="manual-button" type="button">Manual interaction</button>
    </div>
    <p id="manual-count">Manual clicks: 0</p>
  </main>
  <div class="spacer"></div>
  <section id="scroll-anchor">Anchored target far below the first viewport.</section>
  <div class="spacer"></div>
  <script>
    document.querySelector("#manual-button").addEventListener("click", function () {
      var count = Number(document.body.dataset.manualClicks || "0") + 1;
      document.body.dataset.manualClicks = String(count);
      document.querySelector("#manual-count").textContent = "Manual clicks: " + count;
    });
  </script>
</body>
</html>
