<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview Collaboration Acceptance</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f0e8;
      color: #152238;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
    }
    main {
      width: min(760px, calc(100vw - 64px));
      padding: 56px;
      border: 2px solid #152238;
      border-radius: 28px;
      background: #fffdf6;
      box-shadow: 14px 14px 0 #d8b45b;
    }
    #hero-title {
      margin: 0 0 16px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 0.95;
    }
    #paint-target {
      margin: 28px 0;
      padding: 28px;
      border-radius: 18px;
      background: #dce9ff;
      font-size: 20px;
    }
    #cta {
      display: inline-block;
      padding: 14px 22px;
      border: 0;
      border-radius: 999px;
      background: #152238;
      color: white;
      font: inherit;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="hero-title">Awaiting agent</h1>
    <p id="draft-target">source-backed Hello</p>
    <section id="paint-target">Paint across this panel and explain the requested change.</section>
    <button id="cta" type="button">Pending action</button>
  </main>
</body>
</html>
