name: Feature request
description: Propose a scoped improvement to the preview collaboration workflow
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem or limitation without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed change
      description: Describe the observable behavior you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: List current workarounds or rejected approaches.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what belongs in this change and what remains out of scope.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: The proposal preserves the macOS 15+ and single-WKWebView constraints.
          required: true
        - label: The proposal does not require Chromium, Electron, or Playwright.
          required: true
